stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      - PYTHON_VERSION: ["2.7", "3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
  script:
    - python -m pip install -r requirements/test.txt
    - python -m pip install .
    - python -m nose2 -v

distributions:
  stage: build
  image: python:3.14
  script:
    - python -m pip install build twine
    - python -m build
    - python -m twine check dist/*
  artifacts:
    paths:
      - dist/

# Preserve the private snapshots consumer's existing branch-based contract.
# Project identity and completion status are managed on private GitLab.
trigger_build:
  stage: deploy
  image: python:3.14
  rules:
    - if: '$SNAPSHOTS_TOKEN && $CI_COMMIT_BRANCH'
  script:
    - >-
      curl --fail --show-error --silent --request POST
      --form "token=$SNAPSHOTS_TOKEN"
      --form "ref=master"
      --form "variables[CGROUPSPY_BRANCH]=$CI_COMMIT_REF_NAME"
      --form "variables[CGROUPSPY_REVISION]=$CI_COMMIT_SHA"
      https://gitlab.dev.cloudsigma.com/api/v4/projects/49/trigger/pipeline
